services:
  weather-kindle:
    image: ghcr.io/kh3dr0n/weather-kindle:latest
    build: .
    container_name: weather-kindle
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      WU_URL: https://www.wunderground.com/forecast/de/munich
      SELECTOR: .ten-day-frame
      REFRESH_MINUTES: "30"
      ROTATE: "0"         # 90 = rotate graph to fill portrait screen
      CHALLENGE_TIMEOUT_SECONDS: "180"   # max wait for Akamai bot check redirect
      ATTEMPTS: "3"
      TZ: Europe/Berlin
    volumes:
      - ./data:/data
    ipc: host             # Chromium needs more shared memory than Docker's default
